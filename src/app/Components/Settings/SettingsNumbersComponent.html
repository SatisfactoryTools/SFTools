<settings-section [resetCategories]="['numbers']" helpTopic="settings.numbers" title="Numbers" [icon]="sectionIcon">
		<div class="subsection-title">Format</div>
		<div class="row g-3">
			<div class="col-12 col-lg-6">
				<label class="form-label" for="decimal-separator">Decimal separator</label><setting-reset-button category="numbers" field="decimalSeparator"/>
				<select
					id="decimal-separator"
					class="form-select"
					[ngModel]="numbers.decimalSeparator"
					(ngModelChange)="setDecimalSeparator($event)"
				>
					<option value="dot">Dot - 1234.5</option>
					<option value="comma">Comma - 1234,5</option>
				</select>
			</div>

			<div class="col-12 col-lg-6">
				<label class="form-label" for="power-display">Power display</label><setting-reset-button category="numbers" field="powerDisplay"/>
				<select
					id="power-display"
					class="form-select"
					[ngModel]="numbers.powerDisplay"
					(ngModelChange)="setPowerDisplay($event)"
				>
					<option value="scaled">Bigger units when needed - MW / GW / TW</option>
					<option value="mw">Megawatts only - MW</option>
				</select>
			</div>

			<div class="col-12 col-lg-6">
				<label class="form-label" for="item-precision">Decimal places for item amounts</label><setting-reset-button category="numbers" field="itemAmountPrecision"/>
				<input
					id="item-precision"
					type="number"
					min="0"
					max="6"
					step="1"
					class="form-control text-start"
					[ngModel]="numbers.itemAmountPrecision"
					(ngModelChange)="setItemAmountPrecision($event)"
				/>
			</div>

			<div class="col-12 col-lg-6">
				<label class="form-label" for="clock-precision">Decimal places for clock speeds</label><setting-reset-button category="numbers" field="clockSpeedPrecision"/>
				<input
					id="clock-precision"
					type="number"
					min="0"
					max="4"
					step="1"
					class="form-control text-start"
					[ngModel]="numbers.clockSpeedPrecision"
					(ngModelChange)="setClockSpeedPrecision($event)"
				/>
				<div class="form-text">The game allows at most 4.</div>
			</div>

			<div class="col-12 col-lg-6">
				<label class="form-label" for="machine-precision">Decimal places for machine counts</label><setting-reset-button category="numbers" field="machineCountPrecision"/>
				<input
					id="machine-precision"
					type="number"
					min="0"
					max="6"
					step="1"
					class="form-control text-start"
					[ngModel]="numbers.machineCountPrecision"
					(ngModelChange)="setMachineCountPrecision($event)"
				/>
				<div class="form-text">Only used when the graph shows machine counts as decimals (see Graph).</div>
			</div>

			<div class="col-12">
				<div class="form-check">
					<input
						id="show-fluid-unit"
						type="checkbox"
						class="form-check-input"
						[ngModel]="numbers.showFluidUnit"
						(ngModelChange)="setShowFluidUnit($event)"
					/>
					<label class="form-check-label" for="show-fluid-unit">
						Show m³ unit for fluids ("120 m³/min" instead of "120/min")
					</label><setting-reset-button category="numbers" field="showFluidUnit"/>
				</div>
			</div>
		</div>

		<div class="subsection-title">Preview</div>
		<div class="row g-2">
			<div class="col-auto"><span class="badge text-bg-secondary">Amount: {{ rateFormatter.amount(1234.5678) }}</span></div>
			<div class="col-auto"><span class="badge text-bg-secondary">Clock: {{ rateFormatter.clock(66.6667) }}%</span></div>
			<div class="col-auto"><span class="badge text-bg-secondary">Machines: {{ rateFormatter.machineCount(3.84615) }}×</span></div>
			<div class="col-auto"><span class="badge text-bg-secondary">Power: {{ rateFormatter.power(1500) }}</span></div>
		</div>
</settings-section>
