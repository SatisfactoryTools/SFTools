<button
	type="button"
	class="key-btn"
	[class.recording]="recording"
	[class.empty]="!recording && !binding"
	[class.conflict]="conflict && !recording"
	[attr.title]="recording ? 'Press the keys, or Escape to cancel' : 'Click, then press the keys'"
	(click)="start()"
	(blur)="stop()"
	(keydown)="onKeyDown($event)"
>{{ text }}</button>
