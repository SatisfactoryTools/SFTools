@if (recipe(); as recipe) {
	<div class="container-fluid py-3">
		<codex-detail-header backLink="recipes" backLabel="Recipes" [icons]="productIcons(recipe)" [name]="recipe.name">
			@if (recipe.alternate) {
				<span class="badge bg-warning text-dark mt-2">Alternate</span>
			}
		</codex-detail-header>

		<codex-section heading="Recipe" [flush]="true">
			<codex-recipe-list [recipes]="[recipe]" [showNames]="false"/>
		</codex-section>

		@if (usesVariablePower()) {
			<codex-section heading="Details" [flush]="true">
				<table class="table table-sm">
					<tbody>
						<tr>
							<th class="text-secondary fw-normal" style="width: 40%;">Power usage</th>
							<td><power-draw [draw]="variablePowerBand(recipe)"></power-draw> <small class="text-secondary">(varies, averaged)</small></td>
						</tr>
					</tbody>
				</table>
			</codex-section>
		}

		@if (unlockedBy().length > 0) {
			<codex-section heading="Unlocked by" [flush]="true">
				<codex-schematic-list [schematics]="unlockedBy()"/>
			</codex-section>
		}
	</div>
} @else {
	<div class="container-fluid py-3">
		<codex-detail-header backLink="recipes" backLabel="Recipes"/>
		<p class="text-secondary mb-0">Recipe not found.</p>
	</div>
}
