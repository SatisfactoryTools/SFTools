<auth-layout [title]="error ? 'Sign-in failed' : completedForDesktop ? 'Signed in' : 'Signing in'">
	@if (completedForDesktop) {
		<p class="text-center py-2 mb-2">You are signed in to the Satisfactory Tools desktop app. You can close this tab and go back to the app.</p>
		<a href="sftools://" class="btn btn-sm btn-primary w-100">Open the desktop app</a>
	} @else if (error; as message) {
		<div class="alert alert-danger py-2">{{ message }}</div>
		<a routerLink="/auth/login" class="btn btn-sm btn-outline-secondary w-100">Back to sign-in</a>
	} @else {
		<div class="text-center text-secondary py-3">
			<span class="spinner-border spinner-border-sm me-2" role="status"></span>
			Completing {{ providerLabel }} sign-in…
		</div>
	}
</auth-layout>
