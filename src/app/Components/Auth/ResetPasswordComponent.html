<auth-layout title="Reset password">
	@if (success) {
		<div class="alert alert-success mb-0">
			Your password has been updated. <a routerLink="/auth/login">Sign in now</a>
		</div>
	} @else {
		@if (error) {
			<div class="alert alert-danger py-2">{{ error }}</div>
		}

		<form (ngSubmit)="submit()">
			<div class="mb-3">
				<label class="form-label" for="password">New password</label>
				<input class="form-control" id="password" type="password" name="password" [(ngModel)]="password" required autocomplete="new-password" minlength="8">
				<div class="form-text">Minimum 8 characters.</div>
			</div>
			<button class="btn btn-primary w-100" type="submit" [disabled]="loading">
				@if (loading) {
					<span class="spinner-border spinner-border-sm me-2" role="status"></span>
				}
				Set new password
			</button>
		</form>
	}

	<div auth-footer class="card-footer text-center small">
		<a routerLink="/auth/login">Back to sign-in</a>
	</div>
</auth-layout>
