<auth-layout title="Sign in" subtitle="Keep your plans, custom versions and settings on every device.">
	@if (error) {
		<div class="alert alert-danger py-2">{{ error }}</div>
	}

	<oauth-provider-buttons verb="Sign in with" [returnUrl]="returnUrl"></oauth-provider-buttons>

	<info-note class="mt-2">
		Steam can't create a new account - sign in another way first, then link Steam
		from your account page.
	</info-note>

	<div class="d-flex align-items-center gap-2 my-3 text-secondary small">
		<hr class="flex-grow-1 my-0 border-secondary opacity-100"/>
		<span>or</span>
		<hr class="flex-grow-1 my-0 border-secondary opacity-100"/>
	</div>

	@if (!showPasswordForm) {
		<button type="button" class="btn btn-sm btn-outline-secondary w-100" (click)="showPasswordForm = true">
			Sign in with username &amp; password
		</button>
	} @else {
		<form (ngSubmit)="submit()">
			<div class="mb-3">
				<label class="form-label" for="login">Username</label>
				<input class="form-control" id="login" type="text" name="login" [(ngModel)]="login" required autocomplete="username">
			</div>
			<div class="mb-3">
				<label class="form-label" for="password">Password</label>
				<input class="form-control" id="password" type="password" name="password" [(ngModel)]="password" required autocomplete="current-password">
			</div>
			<button class="btn btn-primary w-100" type="submit" [disabled]="loading">
				@if (loading) {
					<span class="spinner-border spinner-border-sm me-2" role="status"></span>
				}
				Sign in
			</button>
		</form>

		<div class="mt-2 text-end small">
			<a routerLink="/auth/forgot-password">Forgot password?</a>
		</div>
	}

	<div auth-footer class="card-footer d-flex justify-content-between align-items-center gap-2 small">
		<button type="button" class="btn btn-link btn-sm p-0 text-secondary" (click)="continueWithout()">Continue without signing in</button>
		<span>New here? <a routerLink="/auth/register" [queryParams]="{returnUrl}">Create account</a></span>
	</div>
</auth-layout>
