<auth-layout title="Create account" subtitle="Signing in with a provider creates your account on the spot - no form needed.">
	@if (success) {
		<div class="alert alert-success mb-0">
			Account created. <a routerLink="/auth/login" [queryParams]="{returnUrl}">Sign in now</a>
		</div>
	} @else {
		<oauth-provider-buttons verb="Sign up with" [includeSteam]="false" [returnUrl]="returnUrl"></oauth-provider-buttons>

		<div class="d-flex align-items-center gap-2 my-3 text-secondary small">
			<hr class="flex-grow-1 my-0 border-secondary opacity-100"/>
			<span>or</span>
			<hr class="flex-grow-1 my-0 border-secondary opacity-100"/>
		</div>

		@if (!showClassicForm) {
			<button type="button" class="btn btn-sm btn-outline-secondary w-100" (click)="showClassicForm = true">
				Register with username &amp; password
			</button>
		} @else {
			@if (error) {
				<div class="alert alert-danger py-2">{{ error }}</div>
			}

			<form (ngSubmit)="submit()">
				<div class="mb-3">
					<label class="form-label" for="login">Username</label>
					<input class="form-control" id="login" type="text" name="login" [(ngModel)]="login" required autocomplete="username">
				</div>
				<div class="mb-3">
					<label class="form-label" for="email">Email</label>
					<input class="form-control" id="email" type="email" name="email" [(ngModel)]="email" required autocomplete="email">
				</div>
				<div class="mb-3">
					<label class="form-label" for="password">Password</label>
					<input class="form-control" id="password" type="password" name="password" [(ngModel)]="password" required autocomplete="new-password" minlength="8">
					<div class="form-text">Minimum 8 characters.</div>
				</div>
				<button class="btn btn-primary w-100" type="submit" [disabled]="loading">
					@if (loading) {
						<span class="spinner-border spinner-border-sm me-2" role="status"></span>
					}
					Register
				</button>
			</form>
		}
	}

	<div auth-footer class="card-footer text-center small">
		Already have an account? <a routerLink="/auth/login" [queryParams]="{returnUrl}">Sign in</a>
	</div>
</auth-layout>
