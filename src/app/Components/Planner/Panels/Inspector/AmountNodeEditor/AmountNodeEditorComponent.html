<div class="p-2 d-flex flex-column gap-2">

	<div class="card">
		<div class="card-header d-flex align-items-center gap-2 py-1 px-2">
			<game-icon [hash]="iconHash" [size]="20" [alt]="node.getDisplayName()"></game-icon>
			<span class="fw-semibold flex-grow-1 text-truncate" [title]="node.getDisplayName()">{{ node.getDisplayName() }}</span>
			<span class="badge text-bg-secondary">{{ typeLabel }}</span>
			<button
				class="btn btn-sm py-0 px-1"
				[class.btn-outline-warning]="node.locked"
				[class.btn-outline-secondary]="!node.locked"
				type="button"
				[tooltip]="lockTooltip" container="body" placement="left"
				(click)="toggleLock()"
			><fa-icon [icon]="node.locked ? faLock : faLockOpen" [fixedWidth]="true"></fa-icon></button>
		</div>
		<div class="card-body p-2 d-flex flex-column gap-2">

			@if (generator; as generatorNode) {
				<div class="d-flex align-items-center gap-2">
					<span class="text-secondary">Fuel</span>
					<span class="d-inline-flex align-items-center gap-1">
						<game-icon [hash]="generatorNode.fuel.item.icon" [size]="18" [alt]="generatorNode.fuel.item.name"></game-icon>
						{{ generatorNode.fuel.item.name }}
					</span>
				</div>
			}

			<div class="d-flex align-items-center gap-2">
				<label class="form-label text-secondary mb-0 text-nowrap" for="amount-node-amount">{{ amountLabel }}</label>
				<div class="input-group input-group-sm">
					<input
						id="amount-node-amount"
						type="number"
						class="form-control form-control-sm bg-dark text-light border-secondary"
						[(ngModel)]="amount"
						(ngModelChange)="onAmountChange()"
						min="0"
						step="any"
					>
					@if (unit; as unitLabel) {
						<span class="input-group-text bg-dark text-secondary border-secondary">{{ unitLabel }}</span>
					}
				</div>
			</div>

			@if (draftPower !== null) {
				<div class="d-flex align-items-center gap-2">
					<span class="text-secondary">Power</span>
					<span class="text-success">{{ rateFormatter.power(draftPower!) }}</span>
				</div>
			}

		</div>
	</div>

</div>
