@if (data.isLoading()) {
	<p class="text-muted mt-4 text-center">Loading...</p>
} @else if (data.error()) {
	<div class="container mt-4">
		<div class="alert alert-danger d-flex flex-wrap align-items-center gap-3" role="alert">
			<span class="flex-grow-1">This version could not be loaded. The server may be updating, which usually takes less than a minute.</span>
			<button type="button" class="btn btn-outline-light btn-sm flex-shrink-0" (click)="data.reload()">Try again</button>
		</div>
	</div>
} @else {
	<router-outlet/>
}
