<navbar/>

@if (notifications.message()) {
	<!-- Drops below the "server is not responding" banner while that is up. The
	     banner lives in the root component, so it can show before the boot
	     resolvers have finished and this one has been created. -->
	<div
		class="position-fixed top-0 start-50 translate-middle-x"
		[style.margin-top]="serverStatus.retrying() ? '108px' : '60px'"
		style="z-index: 1055; min-width: 320px; max-width: 600px;"
	>
		<div
			class="alert mb-0 shadow-sm py-2 px-3 d-flex align-items-center gap-2"
			[class.alert-danger]="notifications.type() === 'error'"
			[class.alert-success]="notifications.type() === 'success'"
			role="alert"
		>
			<span class="flex-grow-1">{{ notifications.message() }}</span>
			<button type="button" class="btn btn-link btn-sm p-0 text-reset flex-shrink-0" aria-label="Dismiss" (click)="notifications.dismiss()">
				<fa-icon [icon]="faXmark"></fa-icon>
			</button>
		</div>
	</div>
}

<!-- Padding, not margin: a margin would swallow the pages' own top margins (margin collapsing). -->
<div class="container-fluid" style="padding-top: 56px;">
	<router-outlet/>
</div>

<settings-conflict-dialog/>
<sign-in-prompt-dialog/>
