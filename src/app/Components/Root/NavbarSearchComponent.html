<div class="position-relative">
	<fa-icon [icon]="faMagnifyingGlass" class="search-icon"></fa-icon>
	<input
		#searchInput
		class="form-control w-100"
		type="search"
		placeholder="Search items, recipes, plans, help&hellip;"
		aria-label="Search everything"
		autocomplete="off"
		[value]="state.query()"
		(input)="onInput($event)"
		(focus)="onFocus()"
		(blur)="onBlur()"
		(keydown)="onKeydown($event)"
	/>
	@if (showResults) {
		<div
			class="position-absolute bg-dark border border-secondary rounded shadow mt-1 py-1 w-100"
			style="z-index: 1060; left: 0;"
			fitViewport [fitViewportReserve]="120" [fitViewportMax]="520"
		>
			@if (state.tooShort()) {
				<div class="px-3 py-2 text-muted small">Start typing to search&hellip;</div>
			} @else if (state.results().length === 0) {
				<div class="px-3 py-2 text-muted small">No results for &ldquo;{{ state.query() }}&rdquo;</div>
			} @else {
				<search-result-list
					[groups]="state.groups()"
					[active]="state.activeResult()"
					(highlight)="state.setActiveResult($event)"
					(select)="open($event)"
				/>
			}
		</div>
	}
</div>
