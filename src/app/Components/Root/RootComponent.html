<!-- Outside the router outlet: the boot resolvers wait for the API, so while it is unreachable nothing below the outlet exists yet. -->
@if (serverStatus.retrying()) {
    <div class="position-fixed top-0 start-50 translate-middle-x" style="margin-top: 60px; z-index: 1056; min-width: 320px; max-width: 600px;">
        <div class="alert alert-warning mb-0 shadow-sm py-2 px-3 d-flex align-items-center gap-2" role="status">
            <span class="spinner-border spinner-border-sm flex-shrink-0" aria-hidden="true"></span>
            <span class="flex-grow-1">The server is not responding. Trying again&hellip;</span>
        </div>
    </div>
}

@if (!connectivity.online()) {
    <div class="position-fixed bottom-0 start-0 m-3" style="z-index: 1056;">
        <button type="button" class="badge rounded-pill text-bg-secondary border-0 py-2 px-3 shadow-sm" title="The server cannot be reached. Click to check again." (click)="connectivity.check()">
            <fa-icon [icon]="faPlugCircleXmark" class="me-1"></fa-icon>Offline
        </button>
    </div>
}

<router-outlet/>

<desktop-update-banner/>
<open-in-desktop/>

<help-image-viewer/>
