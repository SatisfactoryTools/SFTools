name: CI

on:
    push:
    pull_request:

concurrency:
    group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || 'branch' }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
    DESKTOP_VERSION: 1.0.${{ github.run_number }}

jobs:
    build:
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        steps:
            -   uses: actions/checkout@v5

            -   uses: actions/setup-node@v5
                with:
                    node-version: 24
                    cache: npm

            -   run: npm ci

            -   name: Create env.ts from env.prod.ts
                run: cp src/env/env.prod.ts src/env/env.ts

            -   name: Build
                run: npm run build

            -   name: Lint web layer
                run: php -l deploy/web/index.php

            -   name: Upload build artifact
                if: github.event_name == 'push' && github.ref == 'refs/heads/master'
                uses: actions/upload-artifact@v7
                with:
                    name: dist
                    path: dist
                    retention-days: 1
                    include-hidden-files: true

    deploy:
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        steps:
            -   uses: actions/checkout@v5
                with:
                    sparse-checkout: deploy/web

            -   name: Download build artifact
                uses: actions/download-artifact@v8
                with:
                    name: dist
                    path: dist

            -   name: Add web layer
                run: cp -a deploy/web/. dist/

            -   name: Set up SSH
                env:
                    DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                    DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                run: |
                    mkdir -p ~/.ssh
                    printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
                    chmod 600 ~/.ssh/id_deploy
                    ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
                    printf 'Host deploy-target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n' \
                      "$DEPLOY_HOST" "${{ secrets.DEPLOY_USER }}" >> ~/.ssh/config

            -   name: Upload release
                env:
                    DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
                run: |
                    RELEASE="$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
                    echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
                    ssh deploy-target "mkdir -p '$DEPLOY_PATH/releases/$RELEASE'"
                    rsync -az --delete dist/ "deploy-target:$DEPLOY_PATH/releases/$RELEASE/"

            -   name: Switch symlink and prune old releases
                env:
                    DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
                run: |
                    ssh deploy-target "
                      cd '$DEPLOY_PATH' &&
                      ln -s 'releases/$RELEASE' current.tmp &&
                      mv -T current.tmp current &&
                      ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf
                    "

            -   name: Check link previews
                continue-on-error: true
                run: curl -fsS -A Discordbot "https://new.satisfactorytools.com/help?v=${GITHUB_SHA:0:7}" | grep -q 'og:title" content="Help'

    desktop:
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        concurrency:
            group: desktop-build-${{ matrix.os }}
            cancel-in-progress: true
        strategy:
            fail-fast: true
            matrix:
                include:
                    -   name: windows
                        os: windows-latest
                        bundles: nsis
                    -   name: linux
                        os: ubuntu-22.04
                        bundles: appimage,deb,rpm
                    -   name: macos
                        os: macos-latest
                        bundles: dmg
                        rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
                        build-args: --target universal-apple-darwin
        runs-on: ${{ matrix.os }}
        env:
            HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
            SIGN_WITH_CERTUM: ${{ matrix.bundles == 'nsis' && secrets.CERTUM_OTP != '' }}
        steps:
            -   uses: actions/checkout@v5

            -   uses: actions/setup-node@v5
                with:
                    node-version: 24
                    cache: npm

            -   run: npm ci

            -   name: Download build artifact
                uses: actions/download-artifact@v8
                with:
                    name: dist
                    path: dist

            -   uses: dtolnay/rust-toolchain@stable
                with:
                    targets: ${{ matrix.rust-targets }}

            -   uses: Swatinem/rust-cache@v2
                with:
                    workspaces: desktop

            -   name: Install Linux build dependencies
                if: runner.os == 'Linux'
                run: |
                    sudo apt-get update
                    sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            # Certum SimplySign cloud certificate, signed by ssign (github.com/Le-Syl21/ssign):
            # Tauri runs it on every binary it builds (app, NSIS plugins, uninstaller, installer).
            # One TOTP login per run - ssign caches the session for 20 minutes.
            -   name: Install ssign
                if: env.SIGN_WITH_CERTUM == 'true'
                shell: pwsh
                run: |
                    $dir = Join-Path $env:RUNNER_TEMP ssign
                    $zip = Join-Path $env:RUNNER_TEMP ssign.zip
                    Invoke-WebRequest -Uri https://github.com/Le-Syl21/ssign/releases/download/v0.1.7/ssign-windows-x86_64.zip -OutFile $zip
                    $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
                    if ($hash -ne '4ee5389a74ddbeb67e18fe8c8b963734ca13de7b24beffbe430c3f427ecc5e40') { throw "ssign checksum mismatch: $hash" }
                    Expand-Archive -Path $zip -DestinationPath $dir
                    $dir >> $env:GITHUB_PATH

            # A certificate of your own instead: WINDOWS_CERTIFICATE (base64 of the
            # .pfx) and WINDOWS_CERTIFICATE_PASSWORD. Certum wins when both are set.
            -   name: Import Windows signing certificate
                id: windows-certificate
                if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true' && env.SIGN_WITH_CERTUM != 'true'
                shell: pwsh
                env:
                    WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
                    WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
                run: |
                    New-Item -ItemType Directory -Path certificate | Out-Null
                    Set-Content -Path certificate/certificate.txt -Value $env:WINDOWS_CERTIFICATE
                    certutil -decode certificate/certificate.txt certificate/certificate.pfx | Out-Null
                    $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
                    $certificate = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
                    Remove-Item -Recurse -Force certificate
                    "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

            # Code signing for macOS is optional too: without the secrets the app is
            # ad-hoc signed, which runs but makes Gatekeeper ask for "Open Anyway"
            # once. With an Apple Developer ID, add APPLE_CERTIFICATE (base64 of the
            # .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY and, for
            # notarization, APPLE_ID, APPLE_PASSWORD (app-specific) and APPLE_TEAM_ID.
            -   name: Build the desktop app
                shell: bash
                env:
                    TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                    THUMBPRINT: ${{ steps.windows-certificate.outputs.thumbprint }}
                    CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
                    CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
                    APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                    APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                    APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                    APPLE_ID: ${{ secrets.APPLE_ID }}
                    APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                    APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                run: |
                    if [ "$RUNNER_OS" = macOS ] && [ -z "$APPLE_CERTIFICATE" ]; then
                      unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
                      export APPLE_SIGNING_IDENTITY=-
                    fi
                    CONFIG=$(node -e '
                      const config = {version: process.env.DESKTOP_VERSION, build: {beforeBuildCommand: ""}};
                      if (process.env.SIGN_WITH_CERTUM === "true") {
                        config.bundle = {windows: {signCommand: {cmd: "ssign", args: ["-n", "Satisfactory Tools", "-u", "https://satisfactorytools.com", "%1"]}}};
                      } else if (process.env.THUMBPRINT) {
                        config.bundle = {windows: {certificateThumbprint: process.env.THUMBPRINT, timestampUrl: "http://timestamp.digicert.com"}};
                      }
                      console.log(JSON.stringify(config));
                    ')
                    npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.build-args }} --config "$CONFIG"

            # The disk image is the download, not an updater artifact, so it gets its manifest
            # signature here (every manifest entry carries one).
            -   name: Sign the disk image
                if: runner.os == 'macOS'
                env:
                    TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                run: npx tauri signer sign --app-version "$DESKTOP_VERSION" desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg

            -   name: Upload bundles
                uses: actions/upload-artifact@v7
                with:
                    name: bundle-${{ matrix.name }}
                    path: |
                        desktop/target/release/bundle/nsis/*-setup.exe
                        desktop/target/release/bundle/nsis/*-setup.exe.sig
                        desktop/target/release/bundle/appimage/*.AppImage
                        desktop/target/release/bundle/appimage/*.AppImage.sig
                        desktop/target/release/bundle/deb/*.deb
                        desktop/target/release/bundle/deb/*.deb.sig
                        desktop/target/release/bundle/rpm/*.rpm
                        desktop/target/release/bundle/rpm/*.rpm.sig
                        desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
                        desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sig
                        desktop/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
                        desktop/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
                    if-no-files-found: error
                    retention-days: 7

    desktop-publish:
        needs: desktop
        runs-on: ubuntu-latest
        permissions:
            contents: write
        concurrency:
            group: desktop-release
            cancel-in-progress: false
        env:
            DOWNLOAD_URL: ${{ vars.DESKTOP_DOWNLOAD_URL || 'https://api.new.satisfactorytools.com/desktop' }}
        steps:
            -   uses: actions/checkout@v5
                with:
                    sparse-checkout: scripts

            -   uses: actions/setup-node@v5
                with:
                    node-version: 24

            -   name: Download bundles
                uses: actions/download-artifact@v8
                with:
                    pattern: bundle-*
                    path: bundles

            -   name: Build the update manifest
                run: node scripts/desktop-manifest.mjs "$DESKTOP_VERSION" bundles release "$DOWNLOAD_URL"

            -   name: Set up SSH
                env:
                    SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                    SSH_HOST: ${{ secrets.DEPLOY_HOST }}
                    SSH_USER: ${{ secrets.DEPLOY_USER }}
                run: |
                    mkdir -p ~/.ssh
                    printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
                    chmod 600 ~/.ssh/id_deploy
                    ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
                    printf 'Host deploy-target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n' \
                      "$SSH_HOST" "$SSH_USER" >> ~/.ssh/config

            -   name: Upload release
                env:
                    DEPLOY_PATH: ${{ secrets.DESKTOP_DEPLOY_PATH }}
                run: |
                    ssh deploy-target "mkdir -p '$DEPLOY_PATH/$DESKTOP_VERSION'"
                    rsync -az "release/$DESKTOP_VERSION/" "deploy-target:$DEPLOY_PATH/$DESKTOP_VERSION/"
                    rsync -az release/latest.json "deploy-target:$DEPLOY_PATH/latest.json"

            -   name: Prune old versions
                env:
                    DEPLOY_PATH: ${{ secrets.DESKTOP_DEPLOY_PATH }}
                run: |
                    ssh deploy-target "
                      cd '$DEPLOY_PATH' &&
                      ls -1dt */ | tail -n +4 | xargs -r rm -rf
                    "

            -   name: Check the manifest
                run: |
                    curl -fsS "$DOWNLOAD_URL/latest.json" | grep -q "\"version\": \"$DESKTOP_VERSION\""

            # The installers only - the .sig files and the macOS updater archive serve the updater.
            -   name: Publish the GitHub release
                env:
                    GH_TOKEN: ${{ github.token }}
                    NOTES: ${{ github.event.head_commit.message }}
                run: |
                    TAG="desktop-v$DESKTOP_VERSION"
                    FILES=$(find "release/$DESKTOP_VERSION" -type f ! -name '*.sig' ! -name '*.app.tar.gz' | sort)
                    if gh release view "$TAG" > /dev/null 2>&1; then
                      gh release upload "$TAG" --clobber $FILES
                    else
                      gh release create "$TAG" --target "$GITHUB_SHA" --title "Satisfactory Tools $DESKTOP_VERSION" --notes "$NOTES" $FILES
                    fi
